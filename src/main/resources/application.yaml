spring:
  application:
    name: ecom
  datasource:
    url: jdbc:postgresql://localhost:5432/ecom_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server.port: 8082



